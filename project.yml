name: HRMRead
options:
  bundleIdPrefix: com.hrmread
  deploymentTarget:
    iOS: '16.0'
targets:
  HRMRead:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrmread.personal
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleDisplayName: HRM Read
        CFBundleShortVersionString: '0.3.0'
        CFBundleVersion: '3'
        NSBluetoothAlwaysUsageDescription: Connect to your heart rate strap to display live heart rate.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  HRMReadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HRMRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HRMRead:
    build:
      targets:
        HRMRead: all
    test:
      targets: [HRMReadTests]
